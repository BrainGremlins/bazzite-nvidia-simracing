name: bazzite-nvidia-simracing
description: Bazzite + Simagic FFB driver
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: latest

modules:
  - type: copy
    src: hda-jack-retask.conf
    dest: /etc/modprobe.d/

  - type: copy
    src: hda-jack-retask.fw
    dest: /lib/firmware/

  - type: containerfile
    snippets:
      - RUN sudo git clone https://github.com/JacKeTUs/simagic-ff.git /usr/src/simagic-ff
    snippets:
      - RUN sudo dkms install /usr/src/simagic-ff

  - type: initramfs

  - type: signing
