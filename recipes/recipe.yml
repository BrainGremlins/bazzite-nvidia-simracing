name: bazzite-nvidia-simracing
description: Bazzite + Simagic FFB driver
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: latest

modules:
  - type: containerfile
    snippets:
      - |
        RUN sufo dnf install dkms && \
            sudo git clone https://github.com/JacKeTUs/simagic-ff /usr/src/simagic-ff && \
            sudo dkms install /usr/src/simagic-ff
